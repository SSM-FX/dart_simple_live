name: preview-android-arm64

on:
  workflow_dispatch:

jobs:
  build-android-arm64:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: simple_live_app/pubspec.yaml
          cache: true

      - name: Create preview firebase files
        run: |
          cat > simple_live_app/android/app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "slive-preview",
              "storage_bucket": "slive-preview.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:preview123456",
                  "android_client_info": {
                    "package_name": "com.slotsun.slive"
                  }
                },
                "api_key": [
                  {
                    "current_key": "preview-key"
                  }
                ]
              }
            ],
            "configuration_version": "1"
          }
          EOF
          cat > simple_live_app/lib/firebase_options.dart <<'EOF'
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
          import 'package:flutter/foundation.dart'
              show defaultTargetPlatform, kIsWeb, TargetPlatform;

          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform {
              if (kIsWeb) {
                throw UnsupportedError('DefaultFirebaseOptions are not configured for web in preview build.');
              }
              switch (defaultTargetPlatform) {
                case TargetPlatform.android:
                  return android;
                default:
                  throw UnsupportedError(
                    'DefaultFirebaseOptions are not supported for this platform in preview build.',
                  );
              }
            }

            static const FirebaseOptions android = FirebaseOptions(
              apiKey: 'preview-key',
              appId: '1:1234567890:android:preview123456',
              messagingSenderId: '1234567890',
              projectId: 'slive-preview',
              storageBucket: 'slive-preview.appspot.com',
            );
          }
          EOF

      - name: Create temporary release keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore simple_live_app/android/app/preview-release.jks \
            -storepass preview123 \
            -keypass preview123 \
            -alias preview \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Slive Preview, OU=Preview, O=SSM-FX, L=Preview, S=Preview, C=CN"
          cat > simple_live_app/android/key.properties <<'EOF'
          storeFile=preview-release.jks
          storePassword=preview123
          keyPassword=preview123
          keyAlias=preview
          EOF

      - name: Restore packages
        run: |
          cd simple_live_app
          flutter pub get

      - name: Build APK arm64-v8a release
        run: |
          cd simple_live_app
          flutter build apk --release --target-platform android-arm64

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-v8a-release
          path: simple_live_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
